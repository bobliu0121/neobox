[package]
name = "uninstneobox"
version = "10.2.1"
description = "NeoBox Uninstaller"
authors = ["MuLiu"]
edition = "2021"

[lib]
name = "uninstneobox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
dirs = "5"
