[package]
name = "neobox-installer"
version = "10.2.1"
description = "NeoBox Installer"
authors = ["MuLiu"]
edition = "2021"

[lib]
name = "neobox_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
dirs = "5"
zip = "2"
mslnk = "0.1"
