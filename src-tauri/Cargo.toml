[package]
name = "neobox"
version = "1.3.1"
description = "NeoBox - 性能监控与系统优化工具箱"
authors = ["MuLiu_SaMa"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# 工作区：nx-dl-engine 为独立 crate（edition 2024，承载 FluxDown 搬运源码，
# 隔离其 let-chains 等新语法对主工程 edition 的影响）
[workspace]
members = ["nx-dl-engine"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "neobox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 生产构建必须启用 custom-protocol：tauri 2 依据该 feature 决定
# 使用内嵌前端资源（dev = !custom_protocol）；缺失时即使 release
# 也会回退到 devUrl（127.0.0.1）导致页面无法加载。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
nx-dl-engine = { path = "nx-dl-engine" }
tokio-util = { version = "0.7", features = ["io"] }
filetime = "0.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# 不含 devtools：release 构建下 wry 会 SetAreDevToolsEnabled(false)，
# 关闭 F12/右键「检查」（DevTools 打开会额外占 100~300MB 且可任意调用本地 IPC 命令）；
# dev 构建由 debug_assertions 兜住，配合 tauri.conf.json 的 "devtools": true 仍可调试。
tauri = { version = "2.10", features = ["protocol-asset", "tray-icon", "unstable", "webview-data-url"] }
# WebView2 COM 接口（MemoryUsageTargetLevel 等 Win32 级控制，与 wry 同版本）
webview2-com = "0.38"
windows-core = "0.61"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
wmi = "0.14"
thiserror = "2"
reqwest = { version = "0.11", features = ["stream", "json", "blocking", "cookies"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
dirs = "5.0"
nvml-wrapper = "0.10"
sysinfo = "0.30"
chrono = "0.4"
env_logger = "0.11"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
rfd = "0.15"
tauri-plugin-dialog = "2"
urlencoding = "2.1"
url = "2"
base64 = "0.22"
parking_lot = "0.12"
axum = { version = "0.7", features = ["ws", "multipart"] }
zip = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
libloading = "0.8"
spin_sleep = "1.3"

# 网易云 EAPI 加密
md-5 = "0.10"
aes = "0.8"
cipher = "0.4"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
num-bigint = "0.4"
hex = "0.4"

# QQ 音乐搜索签名
sha1 = "0.10"
encoding_rs = "0.8"

# 本地音频元数据解析（封面/标题/艺术家/时长）
lofty = "0.21"

# 存储清理/垃圾清理/大文件扫描
walkdir = "2"
jwalk = "0.8"
glob = "0.3"

# 启动项图标：从 exe 提取图标并编码为 PNG；图片格式转换（png/jpg/jpeg/webp/bmp 互转）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp", "bmp", "gif"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_UI_Accessibility",
    "Win32_UI_ColorSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Media_Multimedia",
    "Win32_Devices_Display",
] }
winreg = "0.52"
winapi = { version = "0.3", features = ["winuser", "windef", "shellapi", "handleapi", "processthreadsapi", "securitybaseapi", "winbase", "winnt", "sddl", "fileapi", "ioapiset", "errhandlingapi", "ntdef", "iphlpapi", "iptypes"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Devices_Properties",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Services",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "UI_UIAutomation",
    "UI_Notifications",
    "UI_Notifications_Management",
    "ApplicationModel",
    "implement",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectWrite",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Power",
] }

# ─────────────────────────────────────────────────────────────────────────────
# 发布构建 profile
#
# 本文件同时是 workspace 根（第 13 行的 [workspace]），因此这里的 profile 对
# neobox 与 nx-dl-engine 两个成员同时生效——**这是唯一正确的放置位置**。
# 依据：nx-dl-engine/Cargo.toml 中没有自己的 [workspace] 段（已 grep 确认），
# 它是被根 workspace 包含的成员，profile 一律由 workspace 根统一决定；
# 子 crate 内写 [profile.*] 会被 cargo 直接忽略并告警。
#
# 改动前 cargo 用的是内置 release 默认值：opt-level=3 / lto=false /
# codegen-units=16 / panic=unwind / strip=none / incremental=false。
# 实测基线：构建耗时 11 分 07 秒，neobox.exe = 109,457,138 字节。
# ─────────────────────────────────────────────────────────────────────────────
[profile.release]
# 1) 跨 crate 内联（fat LTO）。这是本 profile 里对**热路径性能**贡献最大的一项：
#    本项目的热点大量穿透 crate 边界——sysinfo 采集、wmi 的 Variant 解析、
#    nvml-wrapper 的 FFI 包装、image 的编解码、serde_json、regex、lofty 的音频
#    元数据解析。它们原本分布在 16 个 codegen unit 里，跨 crate 基本只能
#    走"不内联的函数调用"；fat LTO 把全部 MIR/bitcode 汇到链接期统一优化，
#    允许把这些小包装函数彻底内联展开、并做跨 crate 的死代码消除（连带
#    减少还在 .rdata 里的泛型单态化副本），因此**同时**减体积、增性能。
#    代价：链接期不再是纯符号拼接，而是一次全量重优化。11 分钟的构建预计
#    拉长到 25~35 分钟（单次发布构建可接受；日常调试走 dev profile 不受影响）。
#    备选：若在 GNU ld 上遇到链接期内存耗尽（本项目静态链接体积大，
#    .text+ .rdata 合计约 72 MiB，属 fat LTO 的高风险区），退到 lto = "thin"
#    可保留大部分收益并把链接时间压回 2~3 分钟量级。
lto = "fat"

# 2) 单 codegen unit。codegen-units=1 让 LLVM 拥有整个 crate 的完整视图，
#    不再受"单位间不可见"限制，能做出更激进的常量传播、函数重排与去虚拟化。
#    与 fat LTO 叠加时才最完整（LTO 只处理"跨 crate"，crate 内仍需 CGU=1）。
#    代价：本 crate 与各依赖的代码生成阶段失去并行度，这是编译时间翻倍的主要
#    来源之一；但换来的是真实运行期收益，对常驻后台的性能监控工具值得。
codegen-units = 1

# 3) 最高优化等级。显式写出来不是为了改变行为（cargo 默认 release 已是 3），
#    而是防止有人误以为 -O2 能"兼顾编译时间"；本项目的瓶颈在运行期采样，
#    不在编译期。opt-level=3 同时开启循环向量化等更激进的优化。
opt-level = 3

# 4) 剥离符号表。**这是体积收益最确定的一项**，实测依据：
#    当前 exe 104.4 MiB，而 PE 各节原始数据只到 77.3 MiB——安全区段
#    （.text 37.52 / .rdata 34.80 / .xdata 3.58 / .pdata 1.00 MiB 等）结束后，
#    文件尾部还挂着 COFF 符号表 3.75 MiB（218,705 条）＋ 符号名字符串表
#    23.35 MiB，合计约 27 MiB 纯调试用元数据。strip="symbols" 去掉的正是这
#    27 MiB（这些表对运行期毫无用处，GNU 链接器默认保留只是方便事后崩溃分析）。
#    选 "symbols" 而非 "debuginfo" 的原因：本产物根本没有 .debug_* 段
#    （节表已逐项核对），膨胀全来自符号表，只有 symbols 能覆盖。
#    安全性：.pdata / .xdata 是 x64 异常展开数据、不属于符号表，strip 不会
#    移除它们，因此 panic=unwind 与 SEH 依然完整可用；本项目也不依赖
#    backtrace 符号化栈（grep Backtrace/RUST_BACKTRACE 无命中，日志只用
#    log::info!/warn! 打印普通文本），所以没有"丢失栈回溯"的代价。
strip = "symbols"

# 5) 关闭增量编译。release 默认本就是 false，这里显式固定是为了防止外部
#    环境变量（CARGO_INCREMENTAL=1）意外打开它——增量编译与 fat LTO 互斥，
#    一旦被打开 cargo 会静默退化为无法 LTO，导致"配置看起来生效、实际没生效"
#    这类极难排查的问题。
incremental = false

# 6) panic 策略：**保持默认 unwind，不设为 "abort"**。
#    这是一项有明确证据的否决，不是保守或偷懒。证据（grep 全部 .rs 源文件）：
#    src-tauri/src/hardware.rs 中存在 5 处 std::panic::catch_unwind，
#    且全部是**业务流程的一环**，不是测试代码：
#      · L1073、L1228、L2046 —— 包住 nvml-wrapper 的 get_nvidia_gpus_with_nvml()，
#        捕获后降级到 LHML/WMI 或返回空列表（"NVML 检测崩溃，已跳过"）；
#      · L1241 —— 包住 get_gpus_from_lhml()，同样是崩溃降级；
#      · L1571 —— 在 GPU 探测子线程里整体兜底，注释写明
#        "GPU 检测线程崩溃，已自动降级"。
#    这些 catch_unwind 存在的根本原因正是 panic=abort 想省掉的东西：GPU/WMI
#    探测要穿过 nvml-wrapper、LibreHardwareMonitor、WMI COM 等多层外部 FFI，
#    驱动异常时会 panic。若设 panic="abort"，这些 catch_unwind 全部失效，
#    一个第三方驱动引发的 panic 会直接**终止整个进程**，把"显卡信息读不到"
#    升级成"工具箱整体闪退"——这是明确的可用性回退，收益（省下约
#    .xdata 3.58 + .pdata 1.00 MiB 异常表的体积、少量运行期性能）远小于代价。
#    因此保留 unwind。若将来移除了这些 FFI 兜底，才值得重新评估此项。
# panic = "unwind"   ← 显式写出以表明是"评估后保留"，而非遗漏
panic = "unwind"

# 说明：未加 [profile.dev]。
#   dev profile 保持 cargo 默认（opt-level=0，依赖也不优化）是有意选择：
#   一旦改动，首次 `tauri dev` 需要全量重编译全部依赖（本项目依赖树极深，
#   含 tauri/wmi/windows/nvml 等），且会立刻使现有的 dev 构建产物失效；
#   更关键的是——本项目正在做热路径性能优化，opt-level=1/2 的 dev 构建
#   无法代表 release 的真实行为，容易被误当成"优化已生效"来测。发布验证
#   统一走 release profile，dev 只保证调试信息完整与增量编译速度。

